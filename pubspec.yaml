name: prediction_league
description: Football score prediction app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  google_sign_in: ^6.2.2
  provider: ^6.1.5+1
  http: ^1.2.2
  cached_network_image: ^3.4.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

# ── App icon ──────────────────────────────────────────────────────────────────
# 1. Create a 1024×1024 PNG at assets/icon/app_icon.png
# 2. Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F0F1A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  ios_icon_background: "#0F0F1A"

# ── Splash screen ─────────────────────────────────────────────────────────────
# 1. Create a centred logo PNG at assets/splash/splash.png (200×200 works well)
# 2. Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0F0F1A"
  image: assets/splash/splash.png
  android: true
  ios: true
  android_12:
    image: assets/splash/splash.png
    color: "#0F0F1A"
    icon_background_color: "#0F0F1A"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
