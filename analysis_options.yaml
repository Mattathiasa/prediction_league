# Static analysis configuration.
#
# The stock `flutter_lints` ruleset is deliberately permissive, so a clean
# `flutter analyze` against it says very little. The strict-* language modes and
# the extra rules below are the ones that actually caught bugs in this codebase:
# unchecked `as int` casts on untrusted Firestore data, a fire-and-forget write
# whose failure surfaced as an unhandled async error, and `dynamic` indexing of
# callable results.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # An unawaited future is how the badge write failed silently on every
    # prediction. Treat it as an error rather than a suggestion.
    unawaited_futures: error
    # Firestore hands back Map<String, dynamic>; indexing it untyped is how a
    # malformed document became a runtime crash.
    avoid_dynamic_calls: error

linter:
  rules:
    # Async correctness
    - unawaited_futures
    - avoid_dynamic_calls
    - discarded_futures
    - await_only_futures

    # Null safety and types
    - avoid_type_to_string
    - null_check_on_nullable_type_parameter
    - prefer_null_aware_method_calls

    # Flutter specifics
    - use_build_context_synchronously
    - use_key_in_widget_constructors
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_colored_box
    - use_decorated_box

    # Consistency
    - prefer_single_quotes
    - require_trailing_commas
    - always_declare_return_types
    - prefer_final_locals
    - unnecessary_parenthesis
    - directives_ordering
    - sort_child_properties_last

    # Hygiene
    - avoid_redundant_argument_values
    - prefer_const_constructors
    - prefer_const_declarations
    - unnecessary_lambdas
