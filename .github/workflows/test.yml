name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — format, analyze, test
    # Ubuntu, not macOS: nothing here builds for iOS, and macOS runners bill at
    # ten times the Linux rate.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # lib/firebase_options.dart is generated by the FlutterFire CLI and is
      # gitignored, so a clean clone cannot resolve the import that main.dart
      # depends on. Without this the analyze step fails on every run.
      - name: Provide placeholder Firebase config
        run: cp lib/firebase_options.dart.template lib/firebase_options.dart

      - run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  functions:
    name: Functions — build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # `npm ci` honours the lockfile; `npm install` silently resolves newer
      # versions, so CI was not testing the dependency set that ships.
      - run: npm ci
        working-directory: functions

      - name: Unit tests
        run: npm test
        working-directory: functions

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # These are the tests that would have caught the rules denying every
      # core write in the app. They run on every push for that reason.
      - name: Run rules tests against the emulator
        run: npm run test:rules
        working-directory: functions
